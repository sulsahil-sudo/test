<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة مؤشر كتلة الجسم</title>

<style>
body{
font-family:Tahoma,sans-serif;
background:#fff5fa;
margin:0;
padding:20px;
}

.close{
position:fixed;
top:15px;
right:15px;
width:45px;
height:45px;
line-height:45px;
text-align:center;
background:#e74c3c;
color:white;
text-decoration:none;
border-radius:50%;
font-size:22px;
font-weight:bold;
}

.box{
max-width:500px;
margin:70px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 15px #ddd;
}

h2{
text-align:center;
color:#d63384;
}

label{
display:block;
margin:12px 0 8px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
font-size:18px;
border:1px solid #ddd;
border-radius:12px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:15px;
font-size:18px;
background:#d63384;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
}

#result{
display:none;
margin-top:20px;
padding:15px;
background:#fff0f6;
border-radius:12px;
line-height:2;
font-weight:bold;
text-align:center;
}
</style>
</head>

<body>

<a href="index.html" class="close">✖</a>

<div class="box">

<h2>⚖️ حاسبة مؤشر كتلة الجسم</h2>

<label>الوزن (كجم)</label>
<input type="number" id="weight">

<label>الطول (سم)</label>
<input type="number" id="height">

<button onclick="calcBMI()">
احسب
</button>

<div id="result"></div>

</div>

<script>
function calcBMI(){

const weight=
parseFloat(
document.getElementById("weight").value
);

const height=
parseFloat(
document.getElementById("height").value
);

if(!weight || !height){
alert("أدخل الوزن والطول");
return;
}

const h=height/100;

const bmi=
(weight/(h*h)).toFixed(1);

let status="";

if(bmi<18.5)
status="نحافة";

else if(bmi<25)
status="وزن طبيعي";

else if(bmi<30)
status="زيادة وزن";

else
status="سمنة";

const result=
document.getElementById("result");

result.style.display="block";

result.innerHTML=`
⚖️ مؤشر كتلة الجسم

<br><br>

${bmi}

<br><br>

📊 التصنيف

<br><br>

${status}
`;

result.scrollIntoView({
behavior:"smooth",
block:"center"
});

}
</script>

</body>
</html>
