<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة الدورة الشهرية</title>

<style>
body{
font-family:Tahoma,sans-serif;
background:#fff5fa;
padding:20px;
position:relative;
}

.close-btn{
position:fixed;
top:15px;
right:15px;
width:42px;
height:42px;
line-height:42px;
text-align:center;
background:#e53935;
color:#fff;
text-decoration:none;
border-radius:50%;
font-size:18px;
font-weight:bold;
z-index:999;
}

.box{
max-width:500px;
margin:70px auto;
background:#fff;
padding:20px;
border-radius:20px;
box-shadow:0 0 15px #ddd;
text-align:center;
}

h2{
font-size:28px;
margin-bottom:20px;
}

label{
display:block;
font-size:18px;
font-weight:bold;
margin:12px 0 8px;
}

input,
select{
width:100%;
padding:14px;
font-size:18px;
text-align:center;
border:1px solid #ddd;
border-radius:12px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:15px;
font-size:20px;
background:#d63384;
color:#fff;
border:none;
border-radius:12px;
cursor:pointer;
}

#result{
display:none;
margin-top:20px;
padding:15px;
background:#fff0f6;
border-radius:12px;
font-size:18px;
font-weight:bold;
line-height:1.8;
}

.note{
display:block;
margin-top:6px;
font-size:14px;
color:#666;
}
</style>
</head>

<body>

<a href="index.html" class="close-btn">✖</a>

<div class="box">

<h2>📅 حاسبة الدورة الشهرية</h2>

<label>بداية الدورة الشهرية</label>
<input type="date" id="lastPeriod">

<label>طول الدورة بالأيام</label>

<select id="cycleLength">
<option value="28" selected>28 يوم (افتراضي)</option>
<option value="21">21 يوم</option>
<option value="22">22 يوم</option>
<option value="23">23 يوم</option>
<option value="24">24 يوم</option>
<option value="25">25 يوم</option>
<option value="26">26 يوم</option>
<option value="27">27 يوم</option>
<option value="29">29 يوم</option>
<option value="30">30 يوم</option>
<option value="31">31 يوم</option>
<option value="32">32 يوم</option>
<option value="33">33 يوم</option>
<option value="34">34 يوم</option>
<option value="35">35 يوم</option>
<option value="36">36 يوم</option>
<option value="37">37 يوم</option>
<option value="38">38 يوم</option>
<option value="39">39 يوم</option>
<option value="40">40 يوم</option>
<option value="41">41 يوم</option>
<option value="42">42 يوم</option>
<option value="43">43 يوم</option>
<option value="44">44 يوم</option>
<option value="45">45 يوم</option>
</select>

<small class="note">
ℹ️ القيمة الافتراضية هي 28 يومًا ويمكن تغييرها من القائمة.
</small>

<button onclick="calc()">احسب</button>

<div id="result"></div>

</div>

<script>
function calc(){

const last=document.getElementById("lastPeriod").value;

if(!last){
alert("اختر تاريخ بداية الدورة");
return;
}

const cycle=Number(document.getElementById("cycleLength").value);

let nextDate=new Date(last);
nextDate.setDate(nextDate.getDate()+cycle);

const dayName=nextDate.toLocaleDateString(
"ar-SA-u-ca-gregory",
{weekday:"long"}
);

const day=nextDate.getDate();

const monthNumber=nextDate.getMonth()+1;

const monthName=nextDate.toLocaleDateString(
"ar-SA-u-ca-gregory",
{month:"long"}
);

const year=nextDate.getFullYear();

const hijriParts=new Intl.DateTimeFormat(
'ar-SA-u-ca-islamic-nu-latn',
{
day:'numeric',
month:'numeric',
year:'numeric'
}
).format(nextDate).split('/');

const hijriDay=hijriParts[0];
const hijriMonth=hijriParts[1];
const hijriYear=hijriParts[2];

const hijriMonthNames={
1:'محرم',
2:'صفر',
3:'ربيع الأول',
4:'ربيع الآخر',
5:'جمادى الأولى',
6:'جمادى الآخرة',
7:'رجب',
8:'شعبان',
9:'رمضان',
10:'شوال',
11:'ذو القعدة',
12:'ذو الحجة'
};

const result=document.getElementById("result");

result.style.display="block";

result.innerHTML=
`
📅 موعد الدورة القادمة<br>
${dayName} ${day} - ${monthNumber} (${monthName}) ${year}

<br><br>

📿 الموافق هجري<br>
${hijriDay} - ${hijriMonth}
(${hijriMonthNames[Number(hijriMonth)]})
${hijriYear} هـ
`;

result.scrollIntoView({
behavior:"smooth",
block:"center"
});

}
</script>

</body>
</html>
