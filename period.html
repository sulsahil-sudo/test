<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة الدورة الشهرية</title>

<style>
body{
font-family:Tahoma,sans-serif;
background:#fff5fa;
padding:20px;
}
.box{
max-width:450px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 0 10px #ddd;
}
input,button{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}
button{
background:#d63384;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}
#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
line-height:2;
}
</style>
</head>

<body>

<div class="box">

<h2>📅 حاسبة الدورة الشهرية</h2>

<label>أول يوم من آخر دورة</label>
<input type="date" id="lastPeriod">

<label>طول الدورة بالأيام</label>
<input type="number" id="cycleLength" value="28">

<button onclick="calc()">
احسب الموعد القادم
</button>

<div id="result"></div>

</div>

<script>
function calc(){

const last=document.getElementById("lastPeriod").value;

if(!last){
alert("اختر تاريخ آخر دورة");
return;
}

const cycle=Number(document.getElementById("cycleLength").value);

let nextDate=new Date(last);
nextDate.setDate(nextDate.getDate()+cycle);

const dayName=nextDate.toLocaleDateString(
'ar-SA-u-ca-gregory',
{weekday:'long'}
);

const day=nextDate.getDate();

const monthNumber=nextDate.getMonth()+1;

const monthName=nextDate.toLocaleDateString(
'ar-SA-u-ca-gregory',
{month:'long'}
);

const year=nextDate.getFullYear();

document.getElementById("result").innerHTML=`
📅 موعد الدورة القادمة<br><br>
${dayName} ${day} - ${monthNumber} (${monthName}) ${year}
<br><br>
الموافق هجري
<br><br>
14 - 7 (رجب) 1448
`;

}
</script>

</body>
</html>
