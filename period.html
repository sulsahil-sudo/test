<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة الدورة الشهرية</title>

<style>
body{
font-family:Tahoma,sans-serif;
background:#fff5fa;
padding:20px;
position:relative;
}

.close-btn{
position:absolute;
top:15px;
right:15px;
width:50px;
height:50px;
line-height:50px;
text-align:center;
background:#e53935;
color:#fff;
text-decoration:none;
border-radius:50%;
font-size:26px;
font-weight:bold;
}

.box{
max-width:500px;
margin:70px auto;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 0 15px #ddd;
text-align:center;
}

h2{
font-size:42px;
margin-bottom:20px;
}

label{
display:block;
font-size:24px;
font-weight:bold;
margin:15px 0 10px;
}

input{
width:100%;
padding:18px;
font-size:26px;
text-align:center;
border:1px solid #ddd;
border-radius:12px;
box-sizing:border-box;
}

button{
width:100%;
padding:18px;
margin-top:15px;
font-size:26px;
background:#d63384;
color:#fff;
border:none;
border-radius:12px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:15px;
font-size:28px;
font-weight:bold;
line-height:1.6;
background:#fff0f6;
border-radius:12px;
display:none;
}
</style>
</head>

<body>

<a href="index.html" class="close-btn">✖</a>

<div class="box">

<h2>📅 حاسبة الدورة الشهرية</h2>

<label>بداية الدورة الشهرية</label>
<input type="date" id="lastPeriod">

<label>طول الدورة بالأيام</label>
<input type="number" id="cycleLength" value="28">

<button onclick="calc()">احسب</button>

<div id="result"></div>

</div>

<script>
function calc(){

const last=document.getElementById("lastPeriod").value;

if(!last){
alert("اختر تاريخ بداية الدورة");
return;
}

const cycle=Number(document.getElementById("cycleLength").value);

let nextDate=new Date(last);
nextDate.setDate(nextDate.getDate()+cycle);

const dayName=nextDate.toLocaleDateString(
"ar-SA-u-ca-gregory",
{weekday:"long"}
);

const day=nextDate.getDate();

const monthNumber=nextDate.getMonth()+1;

const monthName=nextDate.toLocaleDateString(
"ar-SA-u-ca-gregory",
{month:"long"}
);

const year=nextDate.getFullYear();

const hijri=new Intl.DateTimeFormat(
"ar-SA-u-ca-islamic",
{
day:"numeric",
month:"long",
year:"numeric"
}
).format(nextDate);

const result=document.getElementById("result");

result.style.display="block";

result.innerHTML=
`
📅 موعد الدورة القادمة<br>
${dayName} ${day} - ${monthNumber} (${monthName}) ${year}
<br><br>
📿 الموافق هجري<br>
${hijri}
`;

window.scrollTo({
top:0,
behavior:"smooth"
});

}
</script>

</body>
</html>
