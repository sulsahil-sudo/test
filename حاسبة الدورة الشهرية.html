<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة الدورة الشهرية</title>

<style>
body{
font-family:Tahoma,sans-serif;
background:#fff5fa;
padding:20px;
margin:0;
}

.close{
position:fixed;
top:15px;
right:15px;
width:45px;
height:45px;
line-height:45px;
text-align:center;
background:#e74c3c;
color:white;
text-decoration:none;
font-size:22px;
border-radius:50%;
}

.box{
max-width:500px;
margin:70px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 10px #ddd;
}

h2{
text-align:center;
}

label{
display:block;
margin:10px 0;
font-weight:bold;
}

input,select,button{
width:100%;
padding:14px;
font-size:18px;
border-radius:10px;
box-sizing:border-box;
}

button{
background:#d63384;
color:white;
border:none;
margin-top:15px;
}

#result{
display:none;
margin-top:20px;
padding:15px;
background:#fff0f6;
border-radius:12px;
text-align:center;
line-height:2;
font-weight:bold;
}
</style>
</head>

<body>

<a href="index.html" class="close">✖</a>

<div class="box">

<h2>📅 حاسبة الدورة الشهرية</h2>

<label>أول يوم من آخر دورة شهرية</label>
<input type="date" id="lastPeriod">

<label>طول الدورة بالأيام</label>

<select id="cycleLength">
<option value="21">21 يوم</option>
<option value="22">22 يوم</option>
<option value="23">23 يوم</option>
<option value="24">24 يوم</option>
<option value="25">25 يوم</option>
<option value="26">26 يوم</option>
<option value="27">27 يوم</option>
<option value="28" selected>28 يوم</option>
<option value="29">29 يوم</option>
<option value="30">30 يوم</option>
<option value="31">31 يوم</option>
<option value="32">32 يوم</option>
<option value="33">33 يوم</option>
<option value="34">34 يوم</option>
<option value="35">35 يوم</option>
</select>

<button onclick="calc()">احسب</button>

<div id="result"></div>

</div>

<script>
function calc(){

let last=document.getElementById("lastPeriod").value;

if(!last){
alert("اختر أول يوم من آخر دورة");
return;
}

let cycle=Number(
document.getElementById("cycleLength").value
);

let nextDate=new Date(last);

nextDate.setDate(
nextDate.getDate()+cycle
);

let day=nextDate.getDate();

let month=nextDate.getMonth()+1;

let monthName=nextDate.toLocaleDateString(
"ar-SA-u-ca-gregory",
{month:"long"}
);

let year=nextDate.getFullYear();

let hijri=new Intl.DateTimeFormat(
"ar-SA-u-ca-islamic",
{
day:"numeric",
month:"long",
year:"numeric"
}
).format(nextDate);

let result=document.getElementById("result");

result.style.display="block";

result.innerHTML=`
📅 موعد الدورة القادمة
<br><br>
${day}-${month} (${monthName}) - ${year}
<br><br>
📿 الموافق هجري
<br><br>
${hijri}
`;

result.scrollIntoView({
behavior:"smooth"
});

}
</script>

</body>
</html>
