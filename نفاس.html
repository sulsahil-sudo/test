<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة النفاس</title>

<style>
body{
font-family:Tahoma,sans-serif;
background:#fff5fa;
margin:0;
padding:20px;
}

.close{
position:fixed;
top:15px;
right:15px;
width:45px;
height:45px;
line-height:45px;
text-align:center;
background:#e74c3c;
color:#fff;
text-decoration:none;
border-radius:50%;
font-size:22px;
font-weight:bold;
}

.box{
max-width:500px;
margin:70px auto;
background:#fff;
padding:20px;
border-radius:20px;
box-shadow:0 0 15px #ddd;
}

h2{
text-align:center;
color:#d63384;
}

label{
display:block;
margin:12px 0 8px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
font-size:18px;
border:1px solid #ddd;
border-radius:12px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:15px;
font-size:18px;
background:#d63384;
color:#fff;
border:none;
border-radius:12px;
cursor:pointer;
}

#result{
display:none;
margin-top:20px;
padding:15px;
background:#fff0f6;
border-radius:12px;
line-height:2;
font-weight:bold;
text-align:center;
}
</style>
</head>

<body>

<a href="index.html" class="close">✖</a>

<div class="box">

<h2>📆 حاسبة النفاس</h2>

<label>تاريخ الولادة</label>
<input type="date" id="birthDate">

<button onclick="calcNifas()">
احسب
</button>

<div id="result"></div>

</div>

<script>
function formatDate(date){

const day=date.getDate();

const month=date.getMonth()+1;

const monthName=date.toLocaleDateString(
"ar-SA-u-ca-gregory",
{month:"long"}
);

const year=date.getFullYear();

return `${day}-${month} (${monthName}) - ${year}`;
}

function calcNifas(){

const birth=
document.getElementById("birthDate").value;

if(!birth){
alert("اختر تاريخ الولادة");
return;
}

const birthDate=
new Date(birth);

const endNifas=
new Date(birthDate);

endNifas.setDate(
endNifas.getDate()+40
);

const result=
document.getElementById("result");

result.style.display="block";

result.innerHTML=`
👶 تاريخ الولادة

<br><br>

${formatDate(birthDate)}

<br><br>

📆 نهاية النفاس (40 يوم)

<br><br>

${formatDate(endNifas)}

<br><br>

✅ بعد هذا التاريخ تنتهي مدة النفاس المعتادة
`;

result.scrollIntoView({
behavior:"smooth",
block:"center"
});

}
</script>

</body>
</html>
