<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة التبويض</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    background:#f7f8fc;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:#e91e63;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#e91e63;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#d81b60;
}

.result{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#fff3f7;
    border-radius:10px;
    line-height:2;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>🌸 حاسبة التبويض</h1>

        <label>تاريخ أول يوم من آخر دورة</label>
        <input type="date" id="lastPeriod">

        <label>طول الدورة بالأيام</label>
        <input type="number" id="cycleLength" value="28" min="21" max="45">

        <button onclick="calculateOvulation()">
            حساب التبويض
        </button>

        <div id="result" class="result"></div>

    </div>
</div>

<script>

function calculateOvulation(){

    const dateValue =
        document.getElementById("lastPeriod").value;

    const cycleLength =
        parseInt(document.getElementById("cycleLength").value);

    if(!dateValue){
        alert("يرجى اختيار تاريخ الدورة");
        return;
    }

    const startDate = new Date(dateValue);

    const ovulationDate = new Date(startDate);
    ovulationDate.setDate(
        ovulationDate.getDate() + (cycleLength - 14)
    );

    const fertileStart = new Date(ovulationDate);
    fertileStart.setDate(
        fertileStart.getDate() - 3
    );

    const fertileEnd = new Date(ovulationDate);
    fertileEnd.setDate(
        fertileEnd.getDate() + 2
    );

    document.getElementById("result").style.display = "block";

    document.getElementById("result").innerHTML = `
        🌼 يوم التبويض المتوقع:
        <strong>${ovulationDate.toLocaleDateString('ar-SA')}</strong>
        <br><br>

        💖 نافذة الخصوبة:
        <br>
        من
        <strong>${fertileStart.toLocaleDateString('ar-SA')}</strong>
        <br>
        إلى
        <strong>${fertileEnd.toLocaleDateString('ar-SA')}</strong>
        <br><br>

        ✅ أفضل فرصة للحمل تكون قبل التبويض بيومين ويوم التبويض نفسه.
    `;
}

</script>

</body>
</html>
