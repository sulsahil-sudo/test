<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة التبويض</title>

<style>
body{
font-family:Tahoma,sans-serif;
background:#fff5fa;
margin:0;
padding:20px;
}

.close{
position:fixed;
top:15px;
right:15px;
width:45px;
height:45px;
line-height:45px;
text-align:center;
background:#e74c3c;
color:white;
text-decoration:none;
border-radius:50%;
font-size:22px;
font-weight:bold;
}

.box{
max-width:500px;
margin:70px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 15px #ddd;
}

h2{
text-align:center;
}

label{
display:block;
margin:10px 0;
font-weight:bold;
}

input,select,button{
width:100%;
padding:14px;
font-size:18px;
border-radius:10px;
box-sizing:border-box;
}

button{
background:#d63384;
color:white;
border:none;
margin-top:15px;
}

#result{
display:none;
margin-top:20px;
padding:15px;
background:#fff0f6;
border-radius:12px;
text-align:center;
line-height:2;
font-weight:bold;
}
</style>
</head>

<body>

<a href="index.html" class="close">✖</a>

<div class="box">

<h2>🩸 حاسبة التبويض</h2>

<label>أول يوم من آخر دورة شهرية</label>
<input type="date" id="lastPeriod">

<label>طول الدورة بالأيام</label>

<select id="cycleLength">
<option value="21">21 يوم</option>
<option value="22">22 يوم</option>
<option value="23">23 يوم</option>
<option value="24">24 يوم</option>
<option value="25">25 يوم</option>
<option value="26">26 يوم</option>
<option value="27">27 يوم</option>
<option value="28" selected>28 يوم</option>
<option value="29">29 يوم</option>
<option value="30">30 يوم</option>
<option value="31">31 يوم</option>
<option value="32">32 يوم</option>
<option value="33">33 يوم</option>
<option value="34">34 يوم</option>
<option value="35">35 يوم</option>
</select>

<button onclick="calcOvulation()">احسب</button>

<div id="result"></div>

</div>

<script>
function calcOvulation(){

const last =
document.getElementById("lastPeriod").value;

if(!last){
alert("اختر أول يوم من آخر دورة");
return;
}

const cycle =
parseInt(
document.getElementById("cycleLength").value
);

let ovulation =
new Date(last);

ovulation.setDate(
ovulation.getDate()+cycle-14
);

let fertileStart =
new Date(ovulation);

fertileStart.setDate(
fertileStart.getDate()-5
);

const oDay =
ovulation.getDate();

const oMonth =
ovulation.getMonth()+1;

const oYear =
ovulation.getFullYear();

const fDay =
fertileStart.getDate();

const fMonth =
fertileStart.getMonth()+1;

const fYear =
fertileStart.getFullYear();

const result =
document.getElementById("result");

result.style.display="block";

result.innerHTML=`
🩸 يوم التبويض المتوقع

<br><br>

${oDay}-${oMonth}-${oYear}

<br><br>

❤️ فترة الخصوبة

<br><br>

من ${fDay}-${fMonth}-${fYear}

<br>

إلى ${oDay}-${oMonth}-${oYear}
`;

result.scrollIntoView({
behavior:"smooth",
block:"center"
});

}
</script>

</body>
</html>
